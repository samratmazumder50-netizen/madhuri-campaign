
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABVP Campaign Intro</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.stage {
  width: 100vw;
  height: 100dvh;
  max-width: 560px;
  margin: auto;
  position: relative;
  overflow: hidden;
  background: #050505;
  display: flex;
  align-items: center;
  justify-content: center;
}

.orange {
  position: absolute;
  inset: -30%;
  background:
    radial-gradient(ellipse, #ffb52c 0%, #ff5b08 35%,
    #a82005 60%, transparent 75%);
  opacity: 0;
  transform: scale(.4);
}

.logo {
  position: absolute;
  top: 19%;
  width: 70%;
  max-height: 28%;
  object-fit: contain;
  opacity: 0;
  filter: drop-shadow(0 0 25px #ff7b19);
}

.crowd {
  position: absolute;
  bottom: -30%;
  width: 120%;
  height: 40%;
  background: #e84909;
  clip-path: polygon(
    0 100%, 0 55%, 5% 55%, 7% 35%,
    10% 55%, 15% 45%, 18% 15%,
    22% 55%, 28% 40%, 33% 55%,
    38% 20%, 43% 55%, 50% 35%,
    56% 55%, 60% 10%, 65% 55%,
    72% 35%, 78% 55%, 84% 20%,
    90% 55%, 95% 40%, 100% 55%,
    100% 100%
  );
  opacity: 0;
}

.headline {
  position: absolute;
  top: 55%;
  width: 95%;
  text-align: center;
  font-size: clamp(27px, 7vw, 44px);
  font-weight: 900;
  letter-spacing: 2px;
  opacity: 0;
  text-shadow: 0 4px 15px #000;
}

.sub {
  position: absolute;
  top: 72%;
  font-size: 16px;
  font-weight: bold;
  color: #ffd43b;
  letter-spacing: 3px;
  opacity: 0;
}

.play {
  position: absolute;
  z-index: 10;
  padding: 16px 30px;
  background: #f45a0a;
  color: white;
  border: 0;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
}

.playing .orange {
  animation: fire 5s ease-out forwards;
}
.playing .logo {
  animation: logoIn 5s ease-out forwards;
}
.playing .crowd {
  animation: crowdIn 5s ease-out forwards;
}
.playing .headline {
  animation: titleIn 5s ease-out forwards;
}
.playing .sub {
  animation: subIn 5s ease-out forwards;
}

@keyframes fire {
  0%, 12% { opacity: 0; transform: scale(.4); }
  30% { opacity: 1; transform: scale(1.2); }
  100% { opacity: .75; transform: scale(1.5); }
}

@keyframes logoIn {
  0%, 20% { opacity: 0; transform: scale(.5); }
  40% { opacity: 1; transform: scale(1.08); }
  55%, 100% { opacity: 1; transform: scale(1); }
}

@keyframes crowdIn {
  0%, 48% { opacity: 0; bottom: -30%; }
  75%, 100% { opacity: .9; bottom: 0; }
}

@keyframes titleIn {
  0%, 65% { opacity: 0; transform: translateY(35px); }
  85%, 100% { opacity: 1; transform: translateY(0); }
}

@keyframes subIn {
  0%, 78% { opacity: 0; }
  100% { opacity: 1; }
}
</style>
</head>

<body>
<div class="stage" id="stage">

  <div class="orange"></div>

  <img src="ABVP-123221.png" alt="ABVP Logo">

  <div class="crowd"></div>

  <div class="headline">
    THE VOICE OF STUDENTS<br>
    THE POWER OF CHANGE
  </div>

  <div class="sub">
    ASSAM UNIVERSITY · 2026
  </div>

  <button class="play" id="play">▶ PLAY INTRO</button>
</div>

<audio id="music" src="assets/music.mp3"></audio>

<script>
const stage = document.getElementById("stage");
const play = document.getElementById("play");
const music = document.getElementById("music");

play.onclick = () => {
  stage.classList.remove("playing");
  void stage.offsetWidth;
  stage.classList.add("playing");
  play.style.display = "none";

  music.currentTime = 0;
  music.play().catch(() => {});

  setTimeout(() => {
    music.pause();
    play.style.display = "block";
    play.textContent = "↻ REPLAY INTRO";
  }, 5000);
};
</script>
</body>
</html>
